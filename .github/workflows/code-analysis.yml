name: Code Analysis Command Router

on:
  workflow_call:
    inputs:
      language:
        description: 'Language implementation: dotnet | netframework'
        required: true
        type: string
      command:
        description: 'Command to execute'
        required: false
        default: ''
        type: string
      projects:
        description: 'JSON array describing the projects'
        required: false
        default: '[]'
        type: string
      artifacts:
        description: 'JSON array describing the artifacts'
        required: false
        default: '[]'
        type: string
      variables:
        description: 'JSON object with the repository variables'
        required: false
        default: '{}'
        type: string

jobs:
  test:
    if: ${{ inputs.command == 'test' }}
    uses: YelcoBotCompany/devops-core/.github/workflows/code-analysis-test.yml@main
    with:
      language: ${{ inputs.language }}
      variables: ${{ inputs.variables }}
