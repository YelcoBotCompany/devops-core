name: Build, Publish, and Upload Artifacts

on:
  workflow_call:
    inputs:
      language:
        description: 'Language implementation: dotnet | netframework'
        required: true
        type: string
      projects:
        description: 'JSON array describing the projects to publish'
        required: true
        type: string
      artifacts:
        description: 'JSON array describing the artifacts to upload'
        required: false
        default: '[]'
        type: string
      variables:
        description: 'JSON object with the repository variables'
        required: false
        default: '{}'
        type: string

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build .NET
        if: ${{ inputs.language == 'dotnet' }}
        uses: YelcoBotCompany/devops-core/templates/dotnet/build@main
        with:
          solution: ${{ fromJSON(inputs.variables).SOLUTION }}
          configuration: ${{ fromJSON(inputs.variables).CONFIGURATION }}
          platform: ${{ fromJSON(inputs.variables).PLATFORM }}
      - name: Build .NET Framework
        if: ${{ inputs.language == 'netframework' }}
        uses: YelcoBotCompany/devops-core/templates/netframework/build@main
        with:
          solution: ${{ fromJSON(inputs.variables).SOLUTION }}
          configuration: ${{ fromJSON(inputs.variables).CONFIGURATION }}
          platform: ${{ fromJSON(inputs.variables).PLATFORM }}

  publish-dotnet:
    if: ${{ inputs.language == 'dotnet' }}
    needs: build-and-publish
    runs-on: windows-latest
    strategy:
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Publish .NET project - ${{ matrix.project.name }}
        uses: YelcoBotCompany/devops-core/templates/dotnet/publish@main
        with:
          project: ${{ toJSON(matrix.project) }}
          configuration: ${{ fromJSON(inputs.variables).CONFIGURATION }}

  publish-netframework:
    if: ${{ inputs.language == 'netframework' }}
    needs: build-and-publish
    runs-on: windows-latest
    strategy:
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Publish .NET Framework project - ${{ matrix.project.name }}
        uses: YelcoBotCompany/devops-core/templates/netframework/publish@main
        with:
          project: ${{ toJSON(matrix.project) }}
          configuration: ${{ fromJSON(inputs.variables).CONFIGURATION }}
          platform: ${{ fromJSON(inputs.variables).PLATFORM }}

  upload-artifacts:
    needs: [publish-dotnet, publish-netframework]
    runs-on: windows-latest
    strategy:
      matrix:
        artifact: ${{ fromJSON(inputs.artifacts) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload artifact - ${{ matrix.artifact.name }}
        uses: YelcoBotCompany/devops-core/templates/artifact/upload@main
        with:
          artifact-name: ${{ matrix.artifact.name }}
          path: ${{ matrix.artifact.path }}
