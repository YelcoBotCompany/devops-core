name: DevOps Core Main Orchestrator

# Routes each service to its main workflow based on the service input.
# | service                   | language               | command             |
# |---------------------------|------------------------|---------------------|
# | iis                       | dotnet, netframework   | deploy, configure   |
# | nuget                     | dotnet, netframework   | deploy              |
# | visual-studio-marketplace | dotnet, netframework   | deploy              |
# | code-analysis             | dotnet, netframework   | test                |

on:
  workflow_call:
    inputs:
      service:
        description: 'Target service: iis | nuget | visual-studio-marketplace | code-analysis'
        required: true
        type: string
      language:
        description: 'Language implementation: dotnet | netframework'
        required: true
        type: string
      command:
        description: 'Command to execute'
        required: false
        default: ''
        type: string
      projects:
        description: 'JSON array describing the projects'
        required: false
        default: '[]'
        type: string
      artifacts:
        description: 'JSON array describing the artifacts'
        required: false
        default: '[]'
        type: string

jobs:
  iis:
    if: ${{ inputs.service == 'iis' }}
    uses: ./workflows/iis/main.yml
    with:
      service: ${{ inputs.service }}
      language: ${{ inputs.language }}
      command: ${{ inputs.command }}
      projects: ${{ inputs.projects }}
      artifacts: ${{ inputs.artifacts }}

  nuget:
    if: ${{ inputs.service == 'nuget' }}
    uses: ./workflows/nuget/main.yml
    with:
      service: ${{ inputs.service }}
      language: ${{ inputs.language }}
      command: ${{ inputs.command }}
      projects: ${{ inputs.projects }}
      artifacts: ${{ inputs.artifacts }}

  visual-studio-marketplace:
    if: ${{ inputs.service == 'visual-studio-marketplace' }}
    uses: ./workflows/visual-studio-marketplace/main.yml
    with:
      service: ${{ inputs.service }}
      language: ${{ inputs.language }}
      command: ${{ inputs.command }}
      projects: ${{ inputs.projects }}
      artifacts: ${{ inputs.artifacts }}

  code-analysis:
    if: ${{ inputs.service == 'code-analysis' }}
    uses: ./workflows/code-analysis/main.yml
    with:
      language: ${{ inputs.language }}
      command: ${{ inputs.command }}