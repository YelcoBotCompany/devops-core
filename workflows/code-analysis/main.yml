name: Code Analysis Command Router

on:
  workflow_call:
    inputs:
      service:
        description: 'Target service'
        required: true
        type: string
      language:
        description: 'Language implementation: dotnet | netframework'
        required: true
        type: string
      command:
        description: 'Command to execute'
        required: false
        default: ''
        type: string
      projects:
        description: 'JSON array describing the projects'
        required: false
        default: '[]'
        type: string
      artifacts:
        description: 'JSON array describing the artifacts'
        required: false
        default: '[]'
        type: string

jobs:
  test:
    if: ${{ inputs.command == 'test' }}
    uses: ./workflows/code-analysis/commands/test.yml
    with:
      language: ${{ inputs.language }}
