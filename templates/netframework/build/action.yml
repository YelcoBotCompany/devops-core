name: '.NET Framework Build Action'
description: 'Builds one .NET Framework project described by a JSON object'

inputs:
  solution:
    description: 'Path to the solution file'
    required: true
  configuration:
    description: 'Build configuration'
    required: false
  platform:
    description: 'Build platform'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet CLI
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      shell: cmd
      run: nuget restore "${{ inputs.solution }}"

    - name: Build solution
      shell: cmd
      run: >-
        msbuild "${{ inputs.solution }}"
        /p:Configuration="${{ inputs.configuration || 'Release' }}"
        /p:Platform="${{ inputs.platform || 'Any CPU' }}"
