name: '.NET Framework Test Action'
description: 'Runs .NET Framework unit tests with VSTest'

inputs:
  vstest-platform:
    description: 'VSTest target architecture'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Run VSTest
      shell: cmd
      run: |
        rem for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find **\TestPlatform\vstest.console.exe`) do set "VSTEST=%%i"
        rem "%VSTEST%" "**\*Test*.dll" /Platform:"${{ inputs.vstest-platform || 'x64' }}"
        echo VSTest bypassed.
