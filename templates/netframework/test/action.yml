name: '.NET Framework Test Action'
description: 'Tests one .NET Framework project described by a JSON object'

inputs:
  solution:
    description: 'Path to the solution file'
    required: true
  configuration:
    description: 'Build configuration'
    required: false
  platform:
    description: 'Build platform'
    required: false
  vstest-platform:
    description: 'VSTest target architecture'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup VSTest
      uses: microsoft/setup-vstest@v2

    - name: Setup NuGet CLI
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      shell: cmd
      run: nuget restore "${{ inputs.solution }}"

    - name: Build test solution
      shell: cmd
      run: >-
        msbuild "${{ inputs.solution }}"
        /p:Configuration="${{ inputs.configuration || 'Release' }}"
        /p:Platform="${{ inputs.platform || 'AnyCPU' }}"

    - name: Run VSTest
      shell: cmd
      run: >-
        vstest.console.exe "**\*Test*.dll"
        /Platform:"${{ inputs.vstest-platform || 'x64' }}"
