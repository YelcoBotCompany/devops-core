name: '.NET Core Build Action'
description: 'Builds .NET Core solution'

inputs:
  solution:
    description: 'Path to the solution file'
    required: true
  configuration:
    description: 'Build configuration'
    required: false
  platform:
    description: 'Build platform'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    - name: Setup NuGet CLI
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      shell: bash
      run: dotnet restore "${{ inputs.solution }}"

    - name: Clean solution
      shell: bash
      run: |
        dotnet clean \
          "${{ inputs.solution }}" \
          --configuration "${{ inputs.configuration || 'Release' }}" \
          --property:Platform="${{ inputs.platform || 'Any CPU' }}"

    - name: Build solution
      shell: bash
      run: |
        dotnet build \
          "${{ inputs.solution }}" \
          --configuration "${{ inputs.configuration || 'Release' }}" \
          --no-restore \
          --property:Platform="${{ inputs.platform || 'Any CPU' }}"
