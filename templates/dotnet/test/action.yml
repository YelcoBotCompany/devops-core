name: '.NET Core Test Action'
description: 'Runs .NET Core unit tests'

inputs:
  solution:
    description: 'Path to the solution file'
    required: true
  configuration:
    description: 'Build configuration'
    required: false
  platform:
    description: 'Build platform'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Test Solution
      shell: bash
      run: |
        dotnet test \
          "${{ inputs.solution }}" \
          --configuration "${{ inputs.configuration || 'Release' }}" \
          --property:Platform="${{ inputs.platform || 'AnyCPU' }}" \
          --no-build \
          --verbosity normal
